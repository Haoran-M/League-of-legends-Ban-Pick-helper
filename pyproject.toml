[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "league-draft-assistant"
version = "0.5.0"
description = "Offline manual League draft assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["PySide6==6.10.1", "numpy==2.3.4", "pandas==2.3.3"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
build = ["pyinstaller==6.16.0"]

[project.gui-scripts]
league-draft = "league_draft.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
league_draft = ["resources/*.json", "resources/*.sqlite3", "resources/*.md", "resources/*.txt", "resources/icons/*.png", "resources/licenses/*", "storage/migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
