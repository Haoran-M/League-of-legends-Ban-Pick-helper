plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def sharedPython = layout.buildDirectory.dir('generated/sharedPython')
def sharedAssets = layout.buildDirectory.dir('generated/sharedAssets')

tasks.register('syncSharedPython', Sync) {
    from('../../src/league_draft') {
        exclude 'ui/**', '__main__.py', '**/__pycache__/**',
                'resources/icons/**', 'resources/*.sqlite3', 'resources/licenses/**',
                'resources/*.md', 'resources/*.txt'
    }
    into(sharedPython.map { it.dir('league_draft') })
}
tasks.register('syncSharedAssets', Sync) {
    from('../../src/league_draft/resources') {
        exclude 'THIRD_PARTY_NOTICES.md', 'SCORING.md', 'licenses/**'
    }
    from(rootProject.file('THIRD_PARTY_NOTICES_ANDROID.md')) { rename { 'THIRD_PARTY_NOTICES.md' } }
    from(rootProject.file('SCORING_ANDROID.md')) { rename { 'SCORING.md' } }
    from(rootProject.file('licenses')) { into 'licenses' }
    into(sharedAssets)
}

android {
    namespace 'com.leaguedraft.assistant'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.leaguedraft.assistant'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('../.tmp/android-signing/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { debuggable true }
        release {
            // Installable local build. A private production key is required for store distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
            debuggable false
        }
    }
    sourceSets { main { assets.srcDir sharedAssets } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    lint { abortOnError true }
}

chaquopy {
    defaultConfig {
        version = '3.12'
        buildPython(System.getenv('LEAGUE_BUILD_PYTHON') ?: rootProject.file('../.venv/Scripts/python.exe').absolutePath)
    }
    sourceSets { main { srcDir sharedPython } }
}

tasks.named('preBuild').configure { dependsOn 'syncSharedPython', 'syncSharedAssets' }
tasks.configureEach {
    if (name.toLowerCase().contains('python')) {
        if (name != 'syncSharedPython') dependsOn 'syncSharedPython'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
